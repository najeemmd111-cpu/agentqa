[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentqa"
version = "1.0.0"
description = "LLM agent that generates, executes and explains API test scenarios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "numpy>=1.26",
  "pytest>=8",
  "anthropic>=0.40",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3"]
dev = ["ruff>=0.6"]

[project.scripts]
agentqa = "agentqa.cli:main"

[tool.setuptools.packages.find]
include = ["agentqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP042"]
